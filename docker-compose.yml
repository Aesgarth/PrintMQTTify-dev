services:
  printmqttify:
    image: printmqttify
    container_name: printmqttify_container
    privileged: true
    ports:
      - "631:631" # CUPS web interface - change this if cups is already running on host
      - "8080:8080" # PrintMQTTify admin interface
    devices:
      # Uses the PRINTER_DEVICE variable from .env, or defaults to /dev/usb/lp0
      - "${PRINTER_DEVICE:-/dev/usb/lp0}:${PRINTER_DEVICE:-/dev/usb/lp0}"
    volumes:
      - ./custom_drivers:/drivers/custom
      # Persists CUPS configuration so you don't lose printers on restart
      - ./cups_config:/etc/cups 
    environment:
      - HA_DISCOVERY=${HA_DISCOVERY:-true}
      - MQTT_BROKER=${MQTT_BROKER}
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - MQTT_TOPIC=${MQTT_TOPIC:-printer/commands}
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASS=${ADMIN_PASS}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    stdin_open: true
    tty: true
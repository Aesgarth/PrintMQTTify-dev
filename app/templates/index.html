<h2>Home Assistant Integration</h2>
<label class="switch">
    <input type="checkbox" id="ha-toggle" {% if ha_status == 'true' %}checked{% endif %}>
    Enable HA Auto-Discovery
</label>

<script>
    document.getElementById('ha-toggle').addEventListener('change', async (e) => {
        const enabled = e.target.checked;
        const formData = new FormData();
        formData.append('enabled', enabled);
        
        const response = await fetch('/toggle-ha', { method: 'POST', body: formData });
        const result = await response.json();
        if (result.success) {
            alert("Home Assistant entities " + (enabled ? "enabled" : "removed"));
        } else {
            alert("Error: " + result.error);
        }
    });
</script>
